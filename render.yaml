services:
  - type: web
    name: futures-monitor
    env: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: FUTURES_MONITOR_DEPLOYED
        value: "1"
      - key: FUTURES_MONITOR_USERNAME
        value: admin
      - key: FUTURES_MONITOR_PASSWORD
        sync: false
      - key: FUTURES_MONITOR_SECRET_KEY
        generateValue: true
      - key: FUTURES_MONITOR_COOKIE_SECURE
        value: "1"
